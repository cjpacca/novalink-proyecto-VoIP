protocol=udp
bind=0.0.0.0:5060

; =========================================
; PLANTILLA BASE PARA EXTENSIONES
; =========================================
[endpoint-basic](!)
type=endpoint
context=sedes_internas
disallow=all
allow=ulaw
allow=alaw

; =========================================
; EXTENSIÓN 1001
; =========================================
[1001](endpoint-basic)
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
password=secreto1001
username=1001

[1001]
type=aor
max_contacts=1

